<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/styles.css" />
        <title>Resturant</title>
    </head>
    <body>
        <div class="hero-background">
            <navbar class="navbar">
                <div class="navbar-container container">
                    <div class="navbar-first">
                        <div class="navbar-left">
                            <img src="./images/favicon.svg" alt="Resturant" />
                            <h3><span>Restau</span>rent</h3>
                        </div>
                        <div class="navbar-menu">
                            <ul class="navbar-menu-list">
                                <li class="navbar-menu-item">
                                    <a
                                        href="index.html"
                                        class="navbar-menu-link"
                                        >Home</a
                                    >
                                </li>
                                <li class="navbar-menu-item">
                                    <a href="#" class="navbar-menu-link"
                                        >About</a
                                    >
                                </li>
                                <li class="navbar-menu-item">
                                    <a href="#" class="navbar-menu-link"
                                        >Portfolio</a
                                    >
                                </li>
                                <li class="navbar-menu-item">
                                    <a href="#" class="navbar-menu-link"
                                        >Clients</a
                                    >
                                </li>
                                <li class="navbar-menu-item">
                                    <a href="#" class="navbar-menu-link"
                                        >Blog</a
                                    >
                                </li>
                                <li class="navbar-menu-item">
                                    <a href="#" class="navbar-menu-link"
                                        >Contact</a
                                    >
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="navbar-right">
                        <a href="#" class="booking-link link-btn"
                            >Book a Table</a
                        >
                    </div>

                    <!-- Mobile Menu & Hamburger Icon -->
                    <div class="navbar-mobile-menu">
                        <div class="navbar-mobile-menu-toggle">
                            <i class="fas fa-bars fa-2x"></i>
                        </div>
                        <!-- Mobile Menu Items -->
                        <div class="navbar-mobile-menu-items">
                            <ul class="navbar-mobile-menu-list">
                                <li class="navbar-mobile-menu-item">
                                    <a
                                        href="index.html"
                                        class="navbar-mobile-menu-link"
                                        >Home</a
                                    >
                                </li>
                                <li class="navbar-mobile-menu-item">
                                    <a href="#" class="navbar-mobile-menu-link"
                                        >About</a
                                    >
                                </li>
                                <li class="navbar-mobile-menu-item">
                                    <a href="#" class="navbar-mobile-menu-link"
                                        >Portfolio</a
                                    >
                                </li>
                                <li class="navbar-mobile-menu-item">
                                    <a href="#" class="navbar-mobile-menu-link"
                                        >Clients</a
                                    >
                                </li>
                                <li class="navbar-mobile-menu-item">
                                    <a href="#" class="navbar-mobile-menu-link"
                                        >Blog</a
                                    >
                                </li>
                                <li class="navbar-mobile-menu-item">
                                    <a href="#" class="navbar-mobile-menu-link"
                                        >Contact</a
                                    >
                                </li>
                            </ul>
                            <div class="mobile-menu-down">
                                <a href="#" class="booking-link link-btn"
                                    >Book a Table</a
                                >
                            </div>
                        </div>
                    </div>
                </div>
            </navbar>

            <!-- Hero Section -->
            <section class="hero" id="hero">
                <div class="hero-container container">
                    <div class="hero-texts">
                        <div class="hero-heading">
                            <h1>Taste the authentic saudi cuisine</h1>
                        </div>
                        <div class="hero-content">
                            <p>
                                Among the best Saudi chefs in the world, serving
                                you something beyond flavor
                            </p>
                        </div>
                        <div class="hero-link">
                            <a href="#" class="link-btn">Explore menu</a>
                        </div>
                    </div>
                    <div class="hero-images">
                        <img
                            src="./Images/hero-image.jpg"
                            alt="Hero-image"
                            class="main-img"
                        />
                        <img
                            src="./Images/flower-icon.svg"
                            alt="Flower"
                            class="flower-icon"
                        />
                        <img
                            src="./Images/today-offer.svg"
                            alt="Today Offer"
                            class="offer-icon"
                        />
                    </div>
                </div>
            </section>
        </div>

        <script src="./js/script.js"></script>
    </body>
</html>
